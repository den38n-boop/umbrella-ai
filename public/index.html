<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101318"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/icon-192.png"><link rel="stylesheet" href="/style.css">
<title>Umbrella · Сообщения</title><script src="/app.js" defer></script></head>
<body>
<div id="intro" class="intro" hidden><div class="intro-mark">☂</div><p>Лучше использовать наушники.</p></div>
<main id="app" class="app">
<aside class="sidebar" aria-label="Чаты">
  <header class="list-header"><div class="eyebrow">PRIVATE LINE / 001</div><div class="heading"><h1>Сообщения<span class="dot"></span></h1><button id="settings-toggle" class="icon-button" aria-label="Настройки">···</button></div><p class="list-sub">Некоторые вещи лучше не говорить вслух.</p></header>
  <section id="settings" class="settings" hidden><button id="notifications">Включить уведомления</button><button id="export">Скачать сохранение</button><label class="import">Загрузить сохранение<input id="import" type="file" accept="application/json"></label><button id="new-game" class="danger">Начать новую игру</button></section>
  <div class="search-wrap"><label><span>⌕</span><input id="search" type="search" placeholder="Найти разговор" aria-label="Поиск чатов"></label></div>
  <div class="section-label">ВАШИ РАЗГОВОРЫ <span id="chat-count">08</span></div>
  <nav id="chat-list" class="chat-list" aria-label="Список разговоров"></nav>
  <footer class="list-footer"><span class="avatar me">А</span><div><strong>Алина</strong><small>На связи</small></div><span class="secure">◈</span></footer>
</aside>
<section id="conversation" class="conversation" aria-label="Переписка">
  <header class="chat-header"><button id="back" class="icon-button back" aria-label="Вернуться к чатам">‹</button><span id="chat-avatar" class="avatar"></span><div class="chat-heading"><h2 id="chat-title">Академия</h2><p id="chat-status">7 участников · закрытый канал</p></div><span class="header-symbol">☂</span></header>
  <div id="banner" class="banner" role="status" hidden></div>
  <div id="history" class="history" role="log" aria-label="Сообщения" aria-live="polite"></div>
  <div id="typing" class="typing" role="status"></div>
  <form id="form" class="composer"><textarea id="input" rows="1" maxlength="3000" placeholder="Написать сообщение…" aria-label="Ваше сообщение"></textarea><button id="send" type="submit" aria-label="Отправить сообщение">↑</button></form>
  <div class="composer-note">Вы пишете за Алину. Каждое слово имеет значение.</div>
</section>
</main>
</body></html>
